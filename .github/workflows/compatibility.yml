name: Tool compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: tool-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distro-tools:
    name: QEMU and GDB on Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Distribution release series deliberately cover older tool generations.
        # result.json records exact package versions; these are not support floors.
        ubuntu: ['20.04', '22.04', '24.04']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run compile
      - name: Select weekly package download cache
        id: epoch
        run: echo "week=$(node -p 'Math.floor(Date.now() / 604800000)')" >> "$GITHUB_OUTPUT"
      - name: Restore Ubuntu base image archive
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/compatibility-image/ubuntu.tar
          key: ubuntu-image-v1-${{ matrix.ubuntu }}-${{ runner.arch }}-${{ steps.epoch.outputs.week }}
          restore-keys: |
            ubuntu-image-v1-${{ matrix.ubuntu }}-${{ runner.arch }}-
      - name: Load cached layers and check current Ubuntu image
        env:
          UBUNTU_RELEASE: ${{ matrix.ubuntu }}
        run: |
          mkdir -p "$RUNNER_TEMP/compatibility-image"
          image_archive="$RUNNER_TEMP/compatibility-image/ubuntu.tar"
          if [ -f "$image_archive" ]; then docker image load -i "$image_archive"; fi
          docker pull "ubuntu:$UBUNTU_RELEASE"
          docker image save "ubuntu:$UBUNTU_RELEASE" -o "$image_archive"
      - name: Save Ubuntu base image before running tests
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/compatibility-image/ubuntu.tar
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
      - name: Restore distribution package downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/compatibility-debs/*.deb
          key: apt-compat-v1-ubuntu-${{ matrix.ubuntu }}-${{ runner.arch }}-${{ hashFiles('scripts/compatibility/container.sh') }}-${{ steps.epoch.outputs.week }}
          restore-keys: |
            apt-compat-v1-ubuntu-${{ matrix.ubuntu }}-${{ runner.arch }}-${{ hashFiles('scripts/compatibility/container.sh') }}-
      - name: Test real distribution QEMU and GDB
        shell: bash
        run: |
          set -euo pipefail
          compatibility_output="$RUNNER_TEMP/compatibility-${{ matrix.ubuntu }}"
          mkdir -p "$compatibility_output" "$RUNNER_TEMP/compatibility-debs"
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$(readlink -f "$(command -v node)"),dst=/usr/local/bin/node,readonly" \
            --mount "type=bind,src=$compatibility_output,dst=/results" \
            --mount "type=bind,src=$RUNNER_TEMP/compatibility-debs,dst=/var/cache/apt/archives" \
            -e COMPATIBILITY_LABEL="ubuntu-${{ matrix.ubuntu }}" \
            --workdir /repo "ubuntu:${{ matrix.ubuntu }}" \
            bash /repo/scripts/compatibility/container.sh \
            2>&1 | tee "$compatibility_output/run.log"
      - name: Summarize exact versions and capability evidence
        if: always()
        shell: bash
        run: node scripts/compatibility/summary.cjs "$RUNNER_TEMP/compatibility-${{ matrix.ubuntu }}/result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-ubuntu-${{ matrix.ubuntu }}
          path: ${{ runner.temp }}/compatibility-${{ matrix.ubuntu }}/
          if-no-files-found: warn
          retention-days: 14
