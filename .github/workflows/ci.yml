name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore actionlint executable
        id: actionlint
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/actionlint
          key: actionlint-1.7.7-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned actionlint
        if: steps.actionlint.outputs.cache-hit != 'true'
        run: GOBIN="$RUNNER_TEMP/actionlint" CGO_ENABLED=0 go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate every GitHub Actions workflow
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'

  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline
      - run: npm run check
      - run: npm run docs:check
      - name: Unit and contract tests with coverage
        if: runner.os == 'Linux'
        run: npm run test:coverage
      - name: Native platform unit and contract tests
        if: runner.os != 'Linux'
        run: npm test
      - name: Upload coverage
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage/
          if-no-files-found: warn

  integration:
    name: Linux real tools (all backends)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/setup-tools
      - run: npm ci --prefer-offline
      - run: npm run compile
      - name: Test actual NASM, QEMU, GDB and external C build
        run: node scripts/ci/run-suite.cjs --suite full --output artifacts/integration
      - name: Upload complete backend logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-linux
          path: artifacts/integration/
          if-no-files-found: warn

  host:
    name: VS Code ${{ matrix.vscode }} (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            vscode: '1.96.4'
            phases: trusted,untrusted,resources,debug,display,protected,inspection,machine,paging,c-source,dependencies,machine-profiles
          - os: ubuntu-24.04
            vscode: stable
            phases: trusted,untrusted,resources,debug,display,protected,inspection,machine,paging,c-source,dependencies,machine-profiles
          - os: macos-14
            vscode: stable
            phases: trusted,untrusted,resources,debug,display
          - os: windows-2022
            vscode: stable
            phases: trusted,untrusted,resources,debug,display
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
      QEMU_ASM_HOST_PHASES: ${{ matrix.phases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/setup-tools
      - run: npm ci --prefer-offline
      - uses: ./.github/actions/setup-vscode
        with:
          version: ${{ matrix.vscode }}
      - run: npm run compile
      - name: Native macOS / Windows NASM and RSP integration
        if: runner.os != 'Linux'
        run: node scripts/ci/run-suite.cjs --suite native --output artifacts/native
      - name: Linux VS Code host
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/ci/run-suite.cjs --suite host --output artifacts/host
      - name: macOS / Windows VS Code host
        if: runner.os != 'Linux'
        run: node scripts/ci/run-suite.cjs --suite host --output artifacts/host
      - name: Upload native and host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.os }}-${{ matrix.vscode }}
          path: artifacts/
          if-no-files-found: warn

  package:
    name: Build installable VSIX
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline
      - name: Restore pinned packaging tool cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vsce-npm
          key: vsce-4.0.0-node22-${{ runner.os }}-${{ runner.arch }}
      - name: Package runtime dependencies, including decoder WASM
        env:
          npm_config_cache: ${{ runner.temp }}/vsce-npm
          npm_config_prefer_offline: true
        run: npm exec --yes --package=@vscode/vsce@4.0.0 -- vsce package --githubBranch "$GITHUB_SHA" --out "$RUNNER_TEMP/qemu-asm.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: ${{ runner.temp }}/qemu-asm.vsix
          if-no-files-found: error

  installed:
    name: Installed VSIX (VS Code ${{ matrix.vscode }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.96.4', stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/setup-tools
      - run: npm ci --prefer-offline
      - uses: ./.github/actions/setup-vscode
        with:
          version: ${{ matrix.vscode }}
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix
          path: ${{ runner.temp }}/package
      - name: Install separately and test packaged product modules
        run: xvfb-run -a node scripts/ci/installed-tests.cjs --vsix "$RUNNER_TEMP/package/qemu-asm.vsix" --output artifacts/installed
      - name: Upload installed product logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-${{ matrix.vscode }}
          path: artifacts/installed/
          if-no-files-found: warn

  os-project:
    name: Real DreamOS ISO and installed product
    needs: [quality, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DREAMOS_SOURCE: ${{ github.workspace }}/artifacts/dreamos-source
      VSCODE_VERSION: '1.96.4'
    steps:
      - uses: actions/checkout@v4
      - name: Check out the reviewed upstream revision
        uses: actions/checkout@v4
        with:
          repository: dreamos82/Dreamos
          ref: 85393cbcdeb9ca0bafb84e9631c2c7f21be76141
          path: artifacts/dreamos-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/setup-tools
      - run: npm ci --prefer-offline
      - uses: ./.github/actions/setup-vscode
        with:
          version: '1.96.4'
      - run: npm run compile
      - name: Original build baseline and development host
        run: xvfb-run -a node scripts/ci/run-suite.cjs --suite os-project --output artifacts/os-project
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix
          path: ${{ runner.temp }}/package
      - name: Independently installed VSIX with the same real OS
        run: |
          set -o pipefail
          xvfb-run -a node scripts/os-project-installed.cjs "$RUNNER_TEMP/package/qemu-asm.vsix" 2>&1 | tee artifacts/os-project/installed.log
      - name: Upload real OS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-project-dreamos
          path: artifacts/os-project/
          if-no-files-found: warn

  ci:
    name: CI result
    if: always()
    needs: [workflow-lint, quality, integration, host, package, installed, os-project]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every CI layer to succeed
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          for (const [name, job] of Object.entries(jobs)) console.log(`${name}: ${job.result}`);
          if (Object.values(jobs).some(job => job.result !== 'success')) process.exitCode = 1;
          NODE
