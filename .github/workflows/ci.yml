name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate every GitHub Actions workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run docs:check
      - name: Unit and contract tests with coverage
        if: runner.os == 'Linux'
        run: npm run test:coverage
      - name: Native platform unit and contract tests
        if: runner.os != 'Linux'
        run: npm test
      - name: Upload coverage
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage/
          if-no-files-found: warn

  integration:
    name: Linux real tools (all backends)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/setup-tools
      - run: npm ci
      - run: npm run compile
      - name: Test actual NASM, QEMU, GDB and external C build
        run: node scripts/ci/run-suite.cjs --suite full --output artifacts/integration
      - name: Upload complete backend logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-linux
          path: artifacts/integration/
          if-no-files-found: warn

  host:
    name: VS Code ${{ matrix.vscode }} (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            vscode: '1.96.4'
            phases: trusted,untrusted,resources,debug,display,protected,inspection,machine,paging,c-source,dependencies
          - os: ubuntu-24.04
            vscode: stable
            phases: trusted,untrusted,resources,debug,display,protected,inspection,machine,paging,c-source,dependencies
          - os: macos-14
            vscode: stable
            phases: trusted,untrusted,resources,debug,display
          - os: windows-2022
            vscode: stable
            phases: trusted,untrusted,resources,debug,display
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
      QEMU_ASM_HOST_PHASES: ${{ matrix.phases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/setup-tools
      - run: npm ci
      - run: npm run compile
      - name: Native macOS / Windows NASM and RSP integration
        if: runner.os != 'Linux'
        run: node scripts/ci/run-suite.cjs --suite native --output artifacts/native
      - name: Linux VS Code host
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/ci/run-suite.cjs --suite host --output artifacts/host
      - name: macOS / Windows VS Code host
        if: runner.os != 'Linux'
        run: node scripts/ci/run-suite.cjs --suite host --output artifacts/host
      - name: Upload native and host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.os }}-${{ matrix.vscode }}
          path: artifacts/
          if-no-files-found: warn

  package:
    name: Build installable VSIX
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package runtime dependencies, including decoder WASM
        run: npm exec --yes --package=@vscode/vsce@4.0.0 -- vsce package --githubBranch "$GITHUB_SHA" --out "$RUNNER_TEMP/qemu-asm.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: ${{ runner.temp }}/qemu-asm.vsix
          if-no-files-found: error

  installed:
    name: Installed VSIX (VS Code ${{ matrix.vscode }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.96.4', stable]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/setup-tools
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix
          path: ${{ runner.temp }}/package
      - name: Install separately and test packaged product modules
        run: xvfb-run -a node scripts/ci/installed-tests.cjs --vsix "$RUNNER_TEMP/package/qemu-asm.vsix" --output artifacts/installed
      - name: Upload installed product logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-${{ matrix.vscode }}
          path: artifacts/installed/
          if-no-files-found: warn

  ci:
    name: CI result
    if: always()
    needs: [workflow-lint, quality, integration, host, package, installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every CI layer to succeed
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          for (const [name, job] of Object.entries(jobs)) console.log(`${name}: ${job.result}`);
          if (Object.values(jobs).some(job => job.result !== 'success')) process.exitCode = 1;
          NODE
