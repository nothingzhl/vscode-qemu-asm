name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y nasm qemu-system-x86
      - run: npm ci
      - run: npm run check
      - run: npm run compile
      - run: npm test
      - run: npm run test:integration
        timeout-minutes: 2
