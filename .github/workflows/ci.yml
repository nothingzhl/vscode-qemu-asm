name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: ['1.96.4', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm qemu-system-x86 xvfb gdb gcc binutils
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install nasm qemu
      - name: Install Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm qemu -y --no-progress
          $nasm = Get-ChildItem 'C:\Program Files\NASM*' -Filter nasm.exe -Recurse | Select-Object -First 1
          $qemu = Get-ChildItem 'C:\Program Files\qemu' -Filter qemu-system-i386.exe -Recurse | Select-Object -First 1
          if (!$nasm -or !$qemu) { throw 'NASM or QEMU executable not found after installation' }
          "NASM_PATH=$($nasm.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QEMU_PATH=$($qemu.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm run check
      - run: npm run compile
      - run: npm test
      - run: npm run test:integration 2>&1 | tee integration.log
        shell: bash
        timeout-minutes: 2
      - name: Test real QEMU debug adapter
        run: npm run test:debug 2>&1 | tee debug-integration.log
        shell: bash
        timeout-minutes: 3
      - name: Test real QEMU VGA display
        run: npm run test:display 2>&1 | tee display-integration.log
        shell: bash
        timeout-minutes: 2
      - name: Test multi-stage image build and boot
        run: npm run test:stage 2>&1 | tee stage-integration.log
        shell: bash
        timeout-minutes: 2
      - name: Test real QEMU protected-mode debugger
        run: npm run test:protected 2>&1 | tee protected-integration.log
        shell: bash
        timeout-minutes: 3
      - name: Test real QEMU memory and descriptor inspection
        run: npm run test:inspection 2>&1 | tee inspection-integration.log
        shell: bash
        timeout-minutes: 3
      - name: Test actual QEMU disassembly and data breakpoints
        run: npm run test:machine 2>&1 | tee machine-debug-integration.log
        shell: bash
        timeout-minutes: 3
      - name: Test actual QEMU non-PAE paging and physical memory
        run: npm run test:paging 2>&1 | tee paging-integration.log
        shell: bash
        timeout-minutes: 3
      - name: Test externally compiled C machine code on Linux
        if: runner.os == 'Linux'
        run: npm run test:c-machine 2>&1 | tee c-machine-integration.log
        shell: bash
        timeout-minutes: 3
      - name: Test C source debugging with real ELF DWARF and GDB
        if: runner.os == 'Linux'
        run: npm run test:c-source 2>&1 | tee c-source-integration.log
        shell: bash
        timeout-minutes: 4
      - name: Test shared dependency boundaries with actual tools
        if: runner.os == 'Linux'
        run: npm run test:dependencies 2>&1 | tee dependency-integration.log
        shell: bash
        timeout-minutes: 3
      - name: Test Linux VS Code commands and debugger
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host 2>&1 | tee host-test.log
        shell: bash
      - name: Test macOS / Windows VS Code commands and debugger
        if: runner.os != 'Linux'
        run: npm run test:host 2>&1 | tee host-test.log
        shell: bash
      - name: Upload integration and host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.vscode }}
          path: |
            integration.log
            debug-integration.log
            display-integration.log
            stage-integration.log
            protected-integration.log
            inspection-integration.log
            machine-debug-integration.log
            paging-integration.log
            c-machine-integration.log
            c-source-integration.log
            dependency-integration.log
            host-test.log
          if-no-files-found: ignore
