name: Install native integration tools
description: Reuse downloaded packages while the native package manager installs and verifies tools.
inputs:
  linux-packages:
    description: Packages selected by this workflow (not by untrusted runtime input).
    default: nasm qemu-system-x86 xvfb xauth gdb gcc binutils genisoimage libasound2t64 libgbm1 libgtk-3-0t64 libnss3
runs:
  using: composite
  steps:
    - name: Select image scope and weekly download cache epoch
      id: epoch
      shell: bash
      run: |
        echo "week=$(node -p 'Math.floor(Date.now() / 604800000)')" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-$RUNNER_OS}" >> "$GITHUB_OUTPUT"
    - name: Restore Linux package downloads
      id: apt-cache
      if: runner.os == 'Linux'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/qemu-apt/*.deb
        key: apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.epoch.outputs.image }}-${{ hashFiles('.github/actions/setup-tools/action.yml') }}-${{ inputs.linux-packages }}-${{ steps.epoch.outputs.week }}
        restore-keys: |
          apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.epoch.outputs.image }}-${{ hashFiles('.github/actions/setup-tools/action.yml') }}-${{ inputs.linux-packages }}-
    - name: Linux tools
      if: runner.os == 'Linux'
      shell: bash
      env:
        LINUX_PACKAGES: ${{ inputs.linux-packages }}
      run: |
        mkdir -p "$RUNNER_TEMP/qemu-apt"
        read -r -a packages <<< "$LINUX_PACKAGES"
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 -o APT::Keep-Downloaded-Packages=true -o Dir::Cache::archives="$RUNNER_TEMP/qemu-apt" install -y --no-install-recommends "${packages[@]}"
        sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/qemu-apt" autoclean
    - name: Restore Homebrew downloads
      id: brew-cache
      if: runner.os == 'macOS'
      uses: actions/cache/restore@v4
      with:
        path: ~/Library/Caches/Homebrew/downloads
        key: brew-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.epoch.outputs.image }}-${{ steps.epoch.outputs.week }}
        restore-keys: |
          brew-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.epoch.outputs.image }}-
    - name: macOS tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew list nasm >/dev/null 2>&1 || brew install nasm
        brew list qemu >/dev/null 2>&1 || brew install qemu
    - name: Restore Chocolatey downloads
      id: choco-cache
      if: runner.os == 'Windows'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/qemu-choco
        key: choco-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.epoch.outputs.image }}-${{ steps.epoch.outputs.week }}
        restore-keys: |
          choco-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.epoch.outputs.image }}-
    - name: Windows tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install nasm qemu -y --no-progress --cache-location="$env:RUNNER_TEMP\qemu-choco"
        if ($LASTEXITCODE -ne 0) { throw 'Chocolatey installation failed' }
        $nasm = Get-Command nasm.exe -ErrorAction SilentlyContinue
        $qemu = Get-Command qemu-system-i386.exe -ErrorAction SilentlyContinue
        if (!$nasm) { $nasm = Get-ChildItem 'C:\Program Files\NASM*' -Filter nasm.exe -Recurse | Select-Object -First 1 }
        if (!$qemu) { $qemu = Get-ChildItem 'C:\Program Files\qemu' -Filter qemu-system-i386.exe -Recurse | Select-Object -First 1 }
        if (!$nasm -or !$qemu) { throw 'NASM or QEMU executable not found after installation' }
        $nasmPath = if ($nasm.Source) { $nasm.Source } else { $nasm.FullName }
        $qemuPath = if ($qemu.Source) { $qemu.Source } else { $qemu.FullName }
        "NASM_PATH=$nasmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "QEMU_PATH=$qemuPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Record actual tool versions
      shell: bash
      run: |
        "${NASM_PATH:-nasm}" -v
        "${QEMU_PATH:-qemu-system-i386}" --version
        if [ "$RUNNER_OS" = Linux ] && command -v gdb >/dev/null; then gdb --version; fi
        if [ "$RUNNER_OS" = Linux ] && command -v gcc >/dev/null; then gcc --version; fi
    - name: Save Linux downloads before running tests
      if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/qemu-apt/*.deb
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}
    - name: Save Homebrew downloads before running tests
      if: runner.os == 'macOS' && steps.brew-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/Library/Caches/Homebrew/downloads
        key: ${{ steps.brew-cache.outputs.cache-primary-key }}
    - name: Save Chocolatey downloads before running tests
      if: runner.os == 'Windows' && steps.choco-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/qemu-choco
        key: ${{ steps.choco-cache.outputs.cache-primary-key }}
